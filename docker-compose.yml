services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/crashlens.db
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      FIREWORKS_MODEL: ${FIREWORKS_MODEL:-}
      CRASHLENS_API_KEY: ${CRASHLENS_API_KEY:-}
      ACCESS_MODE: ${ACCESS_MODE:-private}
      ALLOW_WORKSPACE_CREATION: ${ALLOW_WORKSPACE_CREATION:-true}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      JOB_QUEUE_SIZE: ${JOB_QUEUE_SIZE:-16}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-300}
    volumes:
      - crashlens-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Stdio MCP clients launch this on demand with `docker compose run --rm -T`.
  mcp-server:
    profiles: ["mcp"]
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      CRASHLENS_URL: http://backend:8080
      CRASHLENS_API_KEY: ${CRASHLENS_API_KEY:-}
    stdin_open: true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  crashlens-data:
